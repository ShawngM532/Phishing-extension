[project]
name = "sentinel-pipeline"
version = "0.1.0"
description = "Sentinel offline data collection, feature extraction, training and export pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tldextract>=5.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
