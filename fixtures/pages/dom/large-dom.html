<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Large DOM</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const root = document.getElementById('root');
      for (let i = 0; i < 3000; i += 1) {
        const div = document.createElement('div');
        div.textContent = 'node ' + i;
        root.appendChild(div);
      }
    </script>
  </body>
</html>
