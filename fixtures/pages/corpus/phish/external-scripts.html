<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secure login</title>
    <script src="https://cdn.other.test/a.js"></script>
    <script src="https://cdn.other.test/b.js"></script>
  </head>
  <body>
    <h1>Sign in</h1>
    <form action="/login" method="post">
      <input type="text" name="user" autocomplete="username" />

      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
