<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Webmail sign in</title>
  </head>
  <body>
    <h1>Sign in to your webmail</h1>
    <form action="/login" method="post">
      <label>Email <input type="text" name="email" autocomplete="username" /></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <p>Please verify your account within 24 hours or it will be suspended.</p>
  </body>
</html>
